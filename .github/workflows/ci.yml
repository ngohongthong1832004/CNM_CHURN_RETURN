name: CI - Lint & Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.10.0

      - name: Run ruff
        run: ruff check model_pipeline serving_pipeline data-pipeline data-simulator --output-format=github
        continue-on-error: true

      - name: Run black (check only)
        run: black --check --diff model_pipeline serving_pipeline data-pipeline data-simulator
        continue-on-error: true

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: model_pipeline
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock
          pip install mlflow==3.8.1 scikit-learn==1.8.0 xgboost==3.1.2 \
                      pandas==2.3.3 numpy==2.3.5 pyyaml==6.0.3 \
                      lightgbm catboost loguru pydantic

      - name: Run unit tests
        working-directory: model_pipeline
        env:
          AWS_ACCESS_KEY_ID: test_key
          AWS_SECRET_ACCESS_KEY: test_secret
          MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
          MLFLOW_TRACKING_URI: http://localhost:5000
          PYTHONPATH: ${{ github.workspace }}/model_pipeline
        run: |
          pytest src/tests/unit \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=junit-unit.xml \
            -v

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: |
            model_pipeline/coverage.xml
            model_pipeline/junit-unit.xml
          retention-days: 14
